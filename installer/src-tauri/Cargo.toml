[package]
name = "md-code-installer"
version = "0.2.0"
description = "MD Code custom Windows installer"
authors = ["MD Code Contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "md_code_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.7.2"
